<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<script src="/shell/boot.js"></script>
<script src="/shell/nav.js"></script>
<link rel="stylesheet" href="/shell/home.css">
<link rel="stylesheet" href="/shell/theme.css">
<title>目录 · Lucubratio</title>
<style>
  .toc-wrap { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
  .toc-row {
    display: flex; align-items: stretch;
    border-bottom: 1px solid var(--line);
  }
  .toc-row.lv1 { background: var(--card); border-radius: 12px; margin: 10px 0 0; border: 1px solid var(--line); }
  .toc-kids { display: none; }
  .toc-kids.open { display: block; }
  .toc-main {
    flex: 1 1 75%; min-width: 0;
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
    padding: 14px 4px 14px 14px;
    background: none; border: 0; text-align: left; color: inherit; font: inherit;
    cursor: pointer;
  }
  .toc-tt { font-size: 15px; line-height: 1.35; }
  .toc-sub { font-size: 12px; color: var(--muted); }
  .toc-del {
    flex: 0 0 auto; padding: 0 14px;
    background: none; border: 0; border-left: 1px solid var(--line);
    color: #c0392b; font-size: 13px; cursor: pointer;
  }
  .toc-del:active { background: var(--soft); }
  /* 危险操作（删除课程）：确认按钮转红，与「跳转」区分开 */
  .toc-dialog .primary.danger { background: #c0392b; }
  .toc-dialog .primary.danger:active { background: #a5342a; }
  .toc-more {
    flex: 0 0 25%; display: flex; align-items: center; justify-content: center;
    background: none; border: 0; border-left: 1px solid var(--line);
    color: var(--muted); font-size: 18px; cursor: pointer;
    transition: transform .18s ease;
  }
  .toc-more.open { transform: rotate(90deg); }
  .toc-more[aria-expanded="true"] { color: var(--accent2); }
  .toc-row.lv2 .toc-tt { padding-left: 14px; font-size: 14.5px; }
  .toc-row.lv2 .toc-kids, .toc-row.lv2 + .toc-kids .toc-row { }
  .toc-row.lv3 { border-bottom-style: dashed; }
  .toc-row.lv3 .toc-tt {
    padding-left: 30px; font-size: 13.5px; color: var(--fg);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .toc-row.lv3 .toc-main { padding-top: 11px; padding-bottom: 11px; }

  /* 二次确认弹窗 */
  dialog.toc-dialog {
    border: 1px solid var(--line); border-radius: 16px; padding: 0;
    background: var(--card); color: var(--fg);
    width: min(88vw, 360px);
  }
  dialog.toc-dialog::backdrop { background: rgba(12, 16, 22, .48); }
  .toc-dlg-body { padding: 18px 16px 6px; }
  .toc-dlg-k { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .toc-dlg-t { font-size: 16px; line-height: 1.4; font-weight: 600; }
  .toc-dlg-s { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .toc-dlg-act { display: flex; gap: 8px; padding: 14px 16px 16px; }
  .toc-dlg-act button {
    flex: 1; padding: 11px 0; border-radius: 10px; font: inherit; font-size: 14.5px;
    border: 1px solid var(--line); background: var(--soft); color: var(--fg); cursor: pointer;
  }
  .toc-dlg-act button.primary { background: var(--accent2); border-color: var(--accent2); color: #fff; }
</style>
</head>
<body class="toc-wrap">

<div class="hero">
  <h1>目录</h1>
  <div class="sub">课程 · 讲义 · 小节</div>
</div>

<div id="toc-tree"><div class="empty">加载中…</div></div>

<dialog class="toc-dialog" id="toc-confirm">
  <div class="toc-dlg-body">
    <div class="toc-dlg-k" id="toc-confirm-kicker">跳转到</div>
    <div class="toc-dlg-t" id="toc-confirm-title"></div>
    <div class="toc-dlg-s" id="toc-confirm-sub"></div>
  </div>
  <div class="toc-dlg-act">
    <button type="button" id="toc-confirm-no">取消</button>
    <button type="button" class="primary" id="toc-confirm-yes">跳转</button>
  </div>
</dialog>

<script src="/shell/tabbar.js"></script>
<script type="module" src="/shell/toc.js"></script>
</body>
</html>
