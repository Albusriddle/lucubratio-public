<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<script src="/shell/boot.js"></script>
<script src="/shell/nav.js"></script>
<link rel="stylesheet" href="/shell/home.css">
<link rel="stylesheet" href="/shell/theme.css">
<title>我的 · Lucubratio</title>
<style>
  .me-h { margin: 22px 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
  .me-h:first-of-type { margin-top: 10px; }
  .tab-pad { padding-bottom: calc(74px + env(safe-area-inset-bottom)); }
</style>
</head>
<body class="tab-pad">

<div class="hero">
  <h1>我的</h1>
  <div class="sub">设置 · 数据 · 关于</div>
</div>

<div class="me-h">数据与备份</div>
<div class="data-card">
  <div class="row"><span class="k">已读记录</span><span class="v" id="st-progress">-</span></div>
  <div class="row"><span class="k">错题记录</span><span class="v" id="st-attempts">-</span></div>
  <div class="row"><span class="k">复习卡片</span><span class="v" id="st-cards">-</span></div>
  <div class="row"><span class="k">存储</span><span class="v" id="st-kind">-</span></div>
  <div class="row" id="st-hint-row"><span class="k">存储提示</span><span class="v" id="st-hint"></span></div>
  <div class="actions">
    <button id="btn-export" class="primary">导出备份</button>
    <button id="btn-import">导入备份</button>
  </div>
</div>

<div class="me-h">外观</div>
<div class="data-card">
  <div class="row"><span class="k">主题</span><span class="v" id="theme-v">跟随系统</span></div>
  <div class="seg" id="theme-seg">
    <button type="button" data-t="auto">跟随系统</button>
    <button type="button" data-t="light">浅色</button>
    <button type="button" data-t="dark">深色</button>
  </div>
  <div class="row" style="margin-top:8px"><span class="k">正文字号</span><span class="v" id="fs-v">标准</span></div>
  <div class="seg" id="fs-seg">
    <button type="button" data-f="15">小</button>
    <button type="button" data-f="16">标准</button>
    <button type="button" data-f="17.5">大</button>
    <button type="button" data-f="19">特大</button>
  </div>
</div>

<div class="me-h">关于</div>
<div class="data-card">
  <div class="row"><span class="k">版本</span><span class="v" id="ver">—</span></div>
  <div class="row"><span class="k">网络</span><span class="v">离线可用 · 无网络权限</span></div>
  <div class="actions">
    <button type="button" onclick="location.href='/diagnostics.html'">环境自检</button>
  </div>
</div>

<script src="/shell/tabbar.js"></script>
<script type="module" src="/shell/home.js"></script>
</body>
</html>
