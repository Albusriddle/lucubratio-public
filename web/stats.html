<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<script src="/shell/boot.js"></script>
<title>学习统计 · Lucubratio</title>
<style>
  :root{
    --bg:#fbfbfd; --fg:#1f2328; --muted:#5b6570; --line:#e3e6ea;
    --accent:#c0392b; --accent2:#1f6feb; --card:#fff; --soft:#f4f6f8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--fg)}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans CJK SC",
                -apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.6;
    padding:calc(12px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    max-width:720px;margin:0 auto;
  }
  .top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .top a{color:var(--muted);text-decoration:none;font-size:14px;padding:6px 2px}
  .top .t{font-size:17px;font-weight:700}
  .s a{color:#1f6feb;text-decoration:underline;text-underline-offset:2px}

  .hero{
    background:linear-gradient(135deg,#1f6feb,#4c8dff);color:#fff;border-radius:16px;
    padding:18px 20px;margin-bottom:12px;box-shadow:0 8px 24px rgba(31,111,235,.22);
  }
  .hero .k{font-size:12px;opacity:.85;letter-spacing:.6px}
  .hero .n{font-size:34px;font-weight:800;line-height:1.15;margin:2px 0 0;font-variant-numeric:tabular-nums}
  .hero .n span{font-size:15px;font-weight:600;margin-left:4px;opacity:.9}
  .hero .s{font-size:12.5px;opacity:.9;margin-top:2px}

  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
  .tile .k{font-size:11.5px;color:var(--muted);letter-spacing:.4px}
  .tile .v{font-size:21px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
  .tile .v small{font-size:12px;font-weight:500;color:var(--muted);margin-left:3px}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:14px}
  .panel h2{font-size:13px;color:var(--muted);margin:0 0 12px;font-weight:600;letter-spacing:.5px}

  .heat{display:grid;grid-template-rows:repeat(7,13px);grid-auto-flow:column;
        grid-auto-columns:13px;gap:3px;justify-content:start}
  .heat i{display:block;width:13px;height:13px;border-radius:3px;background:#ebedf0}
  .heat i[data-lv="1"]{background:#c6e48b}
  .heat i[data-lv="2"]{background:#7bc96f}
  .heat i[data-lv="3"]{background:#239a3b}
  .heat i[data-lv="4"]{background:#196127}
  .heat i.future{background:transparent}
  .heat-foot{display:flex;justify-content:space-between;color:#9aa4b1;font-size:11px;margin-top:8px}

  .bars{display:flex;flex-direction:column;gap:10px}
  .bar-row{display:flex;align-items:center;gap:10px;font-size:12.5px}
  .bar-row .lab{flex:0 0 56px;color:var(--muted)}
  .bar-row .track{flex:1 1 auto;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
  .bar-row .track i{display:block;height:100%;border-radius:4px;background:var(--accent2)}
  .bar-row .num{flex:0 0 auto;font-variant-numeric:tabular-nums;color:var(--fg);min-width:28px;text-align:right}

  .empty{color:var(--muted);font-size:13.5px;line-height:2;padding:10px 4px}
</style>
<link rel="stylesheet" href="/shell/theme.css">
</head>
<body>

<div class="top">
  <a href="/">← 首页</a>
  <span class="t">学习统计</span>
</div>

<div class="hero">
  <div class="k">连续复习</div>
  <div class="n" id="streak">0<span>天</span></div>
  <div class="s" id="sub">加载中…</div>
</div>

<div class="tiles">
  <div class="tile"><div class="k">累计复习</div><div class="v" id="reviews">0<small>次</small></div></div>
  <div class="tile"><div class="k">正确率</div><div class="v" id="acc">—</div></div>
  <div class="tile"><div class="k">今日到期</div><div class="v" id="due">0<small>张</small></div></div>
  <div class="tile"><div class="k">已读篇数</div><div class="v" id="read">0<small>篇</small></div></div>
</div>

<div class="panel">
  <h2>最近 12 周</h2>
  <div class="heat" id="heat"></div>
  <div class="heat-foot"><span id="heatFrom">—</span><span>今天</span></div>
</div>

<div class="panel">
  <h2>卡片状态 · 共 <span id="cardTotal">0</span> 张</h2>
  <div class="bars" id="bars"></div>
</div>

<script type="module" src="/shell/stats.js"></script>
<script src="/shell/nav.js"></script>
<script src="/shell/tabbar.js"></script>
</body>
</html>
