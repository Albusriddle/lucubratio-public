<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<script src="/shell/boot.js"></script>
<title>今日复习 · Lucubratio</title>
<style>
  :root{
    --bg:#fbfbfd; --fg:#1f2328; --muted:#5b6570; --line:#e3e6ea;
    --accent:#c0392b; --accent2:#1f6feb; --card:#fff; --soft:#f4f6f8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--fg)}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans CJK SC",
                -apple-system,"Segoe UI",Roboto,sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased;
    padding:calc(14px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
    max-width:720px;margin:0 auto;
    min-height:100vh;display:flex;flex-direction:column;
  }
  .top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .top a{color:var(--muted);text-decoration:none;font-size:14px;padding:6px 2px}
  .top .t{font-size:17px;font-weight:700}
  .bar{height:4px;border-radius:4px;background:var(--soft);overflow:hidden;margin-bottom:18px}
  .bar i{display:block;height:100%;width:0;background:var(--accent2);border-radius:4px;transition:width .2s}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:18px;box-shadow:0 6px 20px rgba(0,0,0,.05);
  }
  .card[hidden]{display:none}
  .meta{font-size:11.5px;color:var(--muted);letter-spacing:.4px;margin-bottom:10px}
  .meta b{color:var(--accent2);font-weight:600}
  .qtext{font-size:calc(var(--sa-fs, 16px) * 1.06);font-weight:600;line-height:1.5;margin:0 0 14px}
  .src{display:inline-block;font-size:12.5px;color:var(--accent2);text-decoration:none;
       background:#eef4ff;border-radius:999px;padding:6px 12px;margin-bottom:18px}

  .rates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .rates button{
    padding:12px 4px;border-radius:12px;border:1px solid var(--line);
    background:var(--soft);color:var(--fg);font-size:13.5px;font-weight:600;
    display:flex;flex-direction:column;gap:3px;align-items:center;
  }
  .rates button span{font-size:10.5px;font-weight:400;color:var(--muted)}
  .rates button[data-r="1"]{border-color:#f3c9c4}
  .rates button[data-r="2"]{border-color:#f0ddb8}
  .rates button[data-r="3"]{border-color:#c9e6cf}
  .rates button[data-r="4"]{border-color:#c9dcf6}
  .rates button:active{background:#e8ecf1}
  .rates button:disabled{opacity:.55}

  .state{margin-top:22px;text-align:center;color:var(--muted);font-size:13px}
  .state b{color:var(--fg)}
  .empty,.done{margin:auto;text-align:center;color:var(--muted);font-size:14px;line-height:2}
  .empty h2,.done h2{font-size:20px;color:var(--fg);margin:0 0 8px}
  .empty a,.done a{color:var(--accent2);text-decoration:none}
  [hidden]{display:none !important}
</style>
<link rel="stylesheet" href="/shell/theme.css">
</head>
<body>

<div class="top">
  <a href="/">← 首页</a>
  <span class="t">今日复习</span>
</div>
<div class="bar"><i id="prog"></i></div>

<div class="card" id="card" hidden>
  <div class="meta" id="meta">—</div>
  <p class="qtext" id="qtext">—</p>
  <a class="src" id="src" href="#">打开原文 ↗</a>
  <div class="rates" id="rates">
    <button data-r="1">不会<span id="d1"></span></button>
    <button data-r="2">勉强<span id="d2"></span></button>
    <button data-r="3">记得<span id="d3"></span></button>
    <button data-r="4">太简单<span id="d4"></span></button>
  </div>
  <div class="state" id="state"></div>
</div>

<div class="empty" id="empty" hidden>
  <h2>今天没有到期卡片</h2>
  去模拟卷或章节的「自测」里给题目做一次自评，<br>
  系统会按 FSRS 自动排到该复习的那天。<br>
  <a href="/">← 回首页</a>
</div>

<div class="done" id="done" hidden>
  <h2>今日复习完成 🎉</h2>
  <span id="doneText"></span><br>
  <a href="/">← 回首页</a>
</div>

<script type="module" src="/shell/review.js"></script>
</body>
</html>
