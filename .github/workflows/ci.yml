name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: CHANGELOG structure
        run: node scripts/check-changelog.mjs

      - name: Unit tests (pure functions)
        run: node scripts/test.mjs

      - name: Build web bundle
        run: node scripts/build.mjs

      - name: Verify web bundle
        run: node scripts/verify.mjs

      - name: Empty build smoke (D3：无内置内容也能通过校验)
        run: |
          node scripts/build.mjs --empty
          node scripts/verify.mjs
          node scripts/build.mjs   # 恢复常规产物，供后面打包用

      - name: Package pipeline self-test (zip / .lcr / 安全校验)
        run: node scripts/test-package.mjs

      - name: Course library self-test (内置 + 已导入 合并逻辑)
        run: node scripts/test-library.mjs

      - name: Quiz self-check (题目可答性：答案/选项/页码)
        run: |
          node tools/self-check-quizzes.mjs android/app/src/main/assets/web/content/os/01_demo_欢迎.html --allow-no-cite
          node tools/self-check-quizzes.mjs android/app/src/main/assets/web/content/os/02_demo_一页讲义怎么写.html --allow-no-cite

      - name: Tooling smoke (片段预检 + 多段合并)
        run: |
          # lint-fragment 检查的是「源片段」，不是构建产物
          node tools/lint-fragment.mjs content/os/*.html --page --allow-no-cite
          # merge-pages 用两个最小夹具验证重编号与 id 唯一性检查
          printf '<h2 id="1-甲">1. 甲</h2>\n<h3 id="检测 1">检测 1（10 分）题干</h3>\n' > /tmp/f1.html
          printf '<h2 id="2-乙">2. 乙</h2>\n<h3 id="检测 1">检测 1（10 分）题干</h3>\n' > /tmp/f2.html
          node tools/merge-pages.mjs /tmp/merged.html /tmp/f1.html /tmp/f2.html
          grep -q 'id="检测 2"' /tmp/merged.html

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 偶发 504（本机也遇到过）：缓存 Gradle 发行包与依赖，成功一次后不再重复下载
      - uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      # 注意：v3 默认 packages 里含 tools，而新版 SDK 已移除该包（会报 Failed to find package 'tools'）
      # 所以这里显式只装需要的三个包，不再用默认值。
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Assemble debug APK
        env:
          SKIP_WEB_BUILD: '1'   # web 产物上面已构建并校验过，这里跳过重复构建
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
